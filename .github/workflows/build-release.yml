name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.5 (it must be the same as kReleaseVersion in the code)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in the code
        run: |
          code="$(sed -n 's/.*kReleaseVersion = "\(.*\)".*/\1/p' profiles/d012/host/d012_profile.cpp | head -1)"
          echo "kReleaseVersion in the code: $code, tag asked for: $TAG"
          [ "$code" = "$TAG" ] || { echo "They differ: change kReleaseVersion (or the tag) and run again."; exit 1; }

  linux:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the build is large)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
      - name: Data pack (textures and cheats)
        run: |
          df -h . | tail -1
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/data.zip" "https://github.com/$GITHUB_REPOSITORY/releases/download/data-pack/data.zip"
          ls -la "$RUNNER_TEMP/data.zip"
          mkdir -p release/data
          # unzip exits 1 for a mere warning; anything above is a real failure
          unzip -q -o "$RUNNER_TEMP/data.zip" -d release/data || [ $? -eq 1 ]
          rm -f "$RUNNER_TEMP/data.zip"
          ls release/data
          test -d release/data/textures && test -d release/data/ms0/PSP/CHEATS
      - name: Newer Vulkan headers (Ubuntu 22.04's are too old; this keeps its older C library, so the build runs on more distros)
        run: |
          git clone --depth 1 --branch v1.4.363 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "C_INCLUDE_PATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
          grep -m1 'VK_HEADER_VERSION ' "$RUNNER_TEMP/vulkan-headers/include/vulkan/vulkan_core.h"
      - name: Build and package
        run: bash scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/d012_native-linux.tar.gz
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos
      - name: Disk space
        run: |
          rm -rf "$HOME/Library/Android" "$HOME/.dotnet" 2>/dev/null || true
          df -h / | tail -1
      - name: Tools
        run: brew install cmake ninja python || true
      - name: SDL3 source (the script reads SDL_SRC)
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/sdl3.tar.gz" https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          tar -xzf "$RUNNER_TEMP/sdl3.tar.gz" -C "$RUNNER_TEMP"
          echo "SDL_SRC=$RUNNER_TEMP/SDL3-3.4.18" >> "$GITHUB_ENV"
      - name: Vulkan SDK (loader and MoltenVK; the script looks in ~/VulkanSDK/*/macOS)
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o vulkan-sdk.zip https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip
          unzip -q vulkan-sdk.zip
          app="$(ls -d *.app | head -1)"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          sudo "./$bin" --root "$HOME/VulkanSDK/ci" --accept-licenses --default-answer --confirm-command install
          # Wherever the installer put it: the folder that holds lib/libMoltenVK.dylib is the SDK the script is told about.
          moltenvk="$(find "$HOME/VulkanSDK/ci" -name libMoltenVK.dylib 2>/dev/null | head -1)"
          if [ -z "$moltenvk" ]; then
            echo "libMoltenVK.dylib not found after the install; what is there:"
            find "$HOME/VulkanSDK/ci" -maxdepth 3 | head -40
            exit 1
          fi
          sdk="$(dirname "$(dirname "$moltenvk")")"
          echo "Vulkan SDK: $sdk"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/lib" | head -20
      - name: Data pack (textures and cheats)
        run: |
          df -h . | tail -1
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/data.zip" "https://github.com/$GITHUB_REPOSITORY/releases/download/data-pack/data.zip"
          ls -la "$RUNNER_TEMP/data.zip"
          mkdir -p release/data
          # unzip exits 1 for a mere warning; anything above is a real failure
          unzip -q -o "$RUNNER_TEMP/data.zip" -d release/data || [ $? -eq 1 ]
          rm -f "$RUNNER_TEMP/data.zip"
          ls release/data
          test -d release/data/textures && test -d release/data/ms0/PSP/CHEATS
      - name: "Build and package (universal, Intel and Apple Silicon)"
        run: UNIVERSAL=1 bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/d012_native-macos.tar.gz
          if-no-files-found: error
          compression-level: 0

  android:
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (not the Android SDK and NDK, which this job uses)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android
      - name: Newer Vulkan headers
        run: |
          git clone --depth 1 --branch v1.4.363 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "C_INCLUDE_PATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build zip glslang-tools python3
          command -v glslangValidator && python3 --version
      - name: Where the Android SDK and NDK are
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_NDK_LATEST_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)}" >> "$GITHUB_ENV"
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: throwaway key (testing only)."
          fi
      - name: Build and package
        run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/d012_native-android.apk
          if-no-files-found: error
          compression-level: 0

  release:
    # Android is optional: if it fails, Linux and macOS are still attached.
    needs: [linux, macos, android]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la packages
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
              --notes "Draft made by the build. Add the Windows zip, write the notes and publish."
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
